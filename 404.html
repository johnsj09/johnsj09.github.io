<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Jefri Thimoathi Johnson</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<style>
@font-face{font-family:'Onest';font-style:normal;font-display:swap;font-weight:100 900;src:url(/fonts/onest-latin.woff2) format('woff2')}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:grid;place-items:center;padding:2rem;font-family:'Onest',ui-sans-serif,system-ui,sans-serif;color:#efeaff;
  background:radial-gradient(120% 90% at 50% 0%,#2a1f4d 0%,#16122a 55%,#0d0b1a 100%);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:34rem;text-align:center}
.k{font:600 .75rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;color:#b6a4ff}
h1{margin-top:1rem;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.05;letter-spacing:-.035em;font-weight:700}
p{margin-top:1.1rem;font-size:1.0625rem;line-height:1.6;color:rgba(239,234,255,.72)}
a{display:inline-flex;align-items:center;gap:.6rem;margin-top:2rem;min-height:48px;padding:0 1.5rem;border-radius:999px;background:#efeaff;color:#16122a;font-weight:600;text-decoration:none;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
a:hover{transform:scale(1.04)}
a:focus-visible{outline:2px solid #b6a4ff;outline-offset:3px}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <p class="k">404 · Lost in the night</p>
  <h1>This page drifted out of orbit.</h1>
  <p>The link may be old or mistyped. Everything I do is back on the main page.</p>
  <a href="/">Back to the site <span aria-hidden="true">→</span></a>
</main>
<script>
// a still field of stars, drawn once
(() => {
  const c = document.getElementById('sky'), x = c.getContext('2d');
  const draw = () => {
    const d = Math.min(devicePixelRatio || 1, 1.5), w = innerWidth, h = innerHeight;
    c.width = w * d; c.height = h * d; x.scale(d, d);
    for (let i = 0; i < Math.round(w * h / 5000); i++){
      const r = Math.random() * 1.3 + .2;
      x.globalAlpha = .25 + Math.random() * .6;
      x.fillStyle = Math.random() < .15 ? '#f2a57a' : Math.random() < .35 ? '#b6a4ff' : '#efeaff';
      x.beginPath(); x.arc(Math.random() * w, Math.random() * h, r, 0, 7); x.fill();
    }
  };
  draw(); addEventListener('resize', draw);
})();
</script>
</body>
</html>
